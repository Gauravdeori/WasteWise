<svg width="1680" height="1020" viewBox="0 0 1680 1020" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f7f5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f5132" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="arrowg" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1680" height="1020" fill="#f4f7f5"/>

  <!-- Title -->
  <text x="60" y="70" font-size="42" font-weight="700" fill="#0f172a">WasteWise — System Architecture</text>
  <text x="61" y="108" font-size="21" fill="#16A34A" font-weight="600">IoT Real-Time Food Waste Monitoring · IIT Guwahati TIH</text>
  <rect x="60" y="126" width="240" height="4" rx="2" fill="#16A34A"/>

  <!-- Layer band labels -->
  <text x="60"   y="185" font-size="15" font-weight="700" fill="#64748b" letter-spacing="2">① EDGE / FIELD</text>
  <text x="470"  y="185" font-size="15" font-weight="700" fill="#64748b" letter-spacing="2">② CLOUD INGESTION</text>
  <text x="835"  y="185" font-size="15" font-weight="700" fill="#64748b" letter-spacing="2">③ BACKEND</text>
  <text x="1230" y="185" font-size="15" font-weight="700" fill="#64748b" letter-spacing="2">④ PRESENTATION</text>

  <!-- ===== EDGE LAYER ===== -->
  <!-- Load cell -->
  <g filter="url(#sh)">
    <rect x="60" y="330" width="150" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="60" y="330" width="150" height="6" rx="3" fill="#16A34A"/>
  <text x="135" y="378" font-size="30" text-anchor="middle">⚖️</text>
  <text x="135" y="410" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Load Cell</text>
  <text x="135" y="431" font-size="13" fill="#64748b" text-anchor="middle">strain gauge</text>

  <!-- HX711 -->
  <g filter="url(#sh)">
    <rect x="60" y="490" width="150" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="60" y="490" width="150" height="6" rx="3" fill="#16A34A"/>
  <text x="135" y="538" font-size="30" text-anchor="middle">🔬</text>
  <text x="135" y="570" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">HX711</text>
  <text x="135" y="591" font-size="13" fill="#64748b" text-anchor="middle">24-bit ADC</text>

  <!-- ESP32 -->
  <g filter="url(#sh)">
    <rect x="255" y="400" width="170" height="140" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="255" y="400" width="170" height="6" rx="3" fill="#16A34A"/>
  <text x="340" y="452" font-size="32" text-anchor="middle">📶</text>
  <text x="340" y="488" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32</text>
  <text x="340" y="510" font-size="13" fill="#64748b" text-anchor="middle">Wi-Fi MCU · firmware</text>
  <text x="340" y="528" font-size="12" fill="#94a3b8" text-anchor="middle">event detect · calibrate</text>

  <!-- edge internal arrows -->
  <line x1="210" y1="390" x2="253" y2="440" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <line x1="210" y1="550" x2="253" y2="500" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowg)"/>

  <text x="242" y="360" font-size="12" fill="#94a3b8">grams</text>

  <!-- x14 badge -->
  <rect x="255" y="560" width="170" height="30" rx="15" fill="#ecfdf5" stroke="#16A34A"/>
  <text x="340" y="580" font-size="13" font-weight="700" fill="#16A34A" text-anchor="middle">× 28 nodes · 14 hostels</text>

  <!-- EDGE -> CLOUD arrow -->
  <line x1="425" y1="470" x2="560" y2="470" stroke="#16A34A" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="435" y="415" width="118" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="494" y="434" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">HTTPS POST</text>
  <text x="494" y="451" font-size="11" fill="#64748b" text-anchor="middle">f1 kg · f2 hostel · f3 RSSI</text>

  <!-- ===== CLOUD INGESTION ===== -->
  <g filter="url(#sh)">
    <rect x="565" y="345" width="230" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="565" y="345" width="230" height="6" rx="3" fill="#16A34A"/>
  <text x="680" y="392" font-size="30" text-anchor="middle">☁️</text>
  <text x="680" y="424" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">ThingSpeak</text>
  <text x="680" y="446" font-size="12.5" fill="#64748b" text-anchor="middle">time-series ingestion</text>
  <!-- 4 channels -->
  <g font-size="12" fill="#0f5132">
    <rect x="590" y="464" width="82" height="26" rx="6" fill="#ecfdf5" stroke="#bbf7d0"/><text x="631" y="481" text-anchor="middle">Ch1 · H1–4</text>
    <rect x="688" y="464" width="82" height="26" rx="6" fill="#ecfdf5" stroke="#bbf7d0"/><text x="729" y="481" text-anchor="middle">Ch2 · H5–8</text>
    <rect x="590" y="498" width="82" height="26" rx="6" fill="#ecfdf5" stroke="#bbf7d0"/><text x="631" y="515" text-anchor="middle">Ch3 · H9–11</text>
    <rect x="688" y="498" width="82" height="26" rx="6" fill="#ecfdf5" stroke="#bbf7d0"/><text x="729" y="515" text-anchor="middle">Ch4 · H12–14</text>
  </g>
  <text x="680" y="552" font-size="11.5" fill="#94a3b8" text-anchor="middle">4-channel split · 15 s write limit</text>
  <text x="680" y="572" font-size="11.5" fill="#94a3b8" text-anchor="middle">API keys never touch the browser</text>

  <!-- CLOUD -> BACKEND -->
  <line x1="795" y1="470" x2="930" y2="470" stroke="#16A34A" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="800" y="426" width="122" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="861" y="445" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">REST read</text>
  <text x="861" y="462" font-size="11" fill="#64748b" text-anchor="middle">Promise.all · merge</text>

  <!-- ===== BACKEND ===== -->
  <g filter="url(#sh)">
    <rect x="935" y="330" width="250" height="290" rx="18" fill="#0f172a"/>
  </g>
  <rect x="935" y="330" width="250" height="6" rx="3" fill="#16A34A"/>
  <text x="1060" y="382" font-size="30" text-anchor="middle">🖥️</text>
  <text x="1060" y="414" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Node · Express</text>
  <text x="1060" y="436" font-size="12.5" fill="#94a3b8" text-anchor="middle">credential proxy · Vercel</text>

  <g font-size="12.5" fill="#e2e8f0">
    <rect x="960" y="454" width="200" height="28" rx="7" fill="#1e293b"/><text x="975" y="473">GET  /api/feeds</text>
    <rect x="960" y="488" width="200" height="28" rx="7" fill="#1e293b"/><text x="975" y="507">POST /api/reading  🔒</text>
    <rect x="960" y="522" width="200" height="28" rx="7" fill="#1e293b"/><text x="975" y="541">GET  /api/ads/playlist</text>
    <rect x="960" y="556" width="200" height="28" rx="7" fill="#1e293b"/><text x="975" y="575">POST /api/login · reset  🔒</text>
  </g>
  <rect x="960" y="592" width="200" height="20" rx="10" fill="#16A34A"/>
  <text x="1060" y="607" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">🔒 = requires admin token</text>

  <!-- .env chip -->
  <rect x="935" y="640" width="250" height="34" rx="10" fill="#ecfdf5" stroke="#16A34A"/>
  <text x="1060" y="662" font-size="13" font-weight="600" fill="#0f5132" text-anchor="middle">.env — TS keys · admin creds · Cloudinary</text>

  <!-- Cloudinary side -->
  <g filter="url(#sh)">
    <rect x="935" y="720" width="250" height="90" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="935" y="720" width="6" height="90" rx="3" fill="#16A34A"/>
  <text x="1060" y="758" font-size="24" text-anchor="middle">🖼️</text>
  <text x="1060" y="786" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Cloudinary · ad media</text>
  <line x1="1060" y1="674" x2="1060" y2="718" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrowg)"/>

  <!-- BACKEND -> PRESENTATION -->
  <line x1="1185" y1="470" x2="1300" y2="470" stroke="#16A34A" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="1190" y="426" width="106" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1243" y="445" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">JSON API</text>
  <text x="1243" y="462" font-size="11" fill="#64748b" text-anchor="middle">same-origin</text>

  <!-- ===== PRESENTATION ===== -->
  <!-- Admin -->
  <g filter="url(#sh)"><rect x="1305" y="210" width="315" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1305" y="210" width="6" height="110" rx="3" fill="#16A34A"/>
  <text x="1345" y="258" font-size="26">🛡️</text>
  <text x="1380" y="252" font-size="18" font-weight="700" fill="#0f172a">Admin Dashboard</text>
  <text x="1380" y="278" font-size="13" fill="#64748b">full analytics · reset · log readings</text>
  <text x="1380" y="298" font-size="13" fill="#64748b">14-hostel bento grid · CSV export</text>

  <!-- User -->
  <g filter="url(#sh)"><rect x="1305" y="340" width="315" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1305" y="340" width="6" height="110" rx="3" fill="#16A34A"/>
  <text x="1345" y="392" font-size="26">👤</text>
  <text x="1380" y="382" font-size="18" font-weight="700" fill="#0f172a">User Dashboard</text>
  <text x="1380" y="408" font-size="13" fill="#64748b">read-only view · fewer KPIs</text>
  <text x="1380" y="428" font-size="13" fill="#64748b">no write / no admin controls</text>

  <!-- Ads -->
  <g filter="url(#sh)"><rect x="1305" y="470" width="315" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1305" y="470" width="6" height="110" rx="3" fill="#16A34A"/>
  <text x="1345" y="518" font-size="26">📣</text>
  <text x="1380" y="512" font-size="18" font-weight="700" fill="#0f172a">Ads Manager (admin-only)</text>
  <text x="1380" y="538" font-size="13" fill="#64748b">upload · schedule · target hostels</text>
  <text x="1380" y="558" font-size="13" fill="#64748b">interval + duration · impressions</text>

  <!-- Kiosk TVs -->
  <g filter="url(#sh)"><rect x="1305" y="600" width="315" height="130" rx="16" fill="#ecfdf5" stroke="#16A34A"/></g>
  <rect x="1305" y="600" width="6" height="130" rx="3" fill="#16A34A"/>
  <text x="1345" y="650" font-size="26">📺</text>
  <text x="1380" y="640" font-size="18" font-weight="700" fill="#0f5132">Hostel TV Kiosks</text>
  <text x="1380" y="666" font-size="13" fill="#0f5132">display.html · one per mess</text>
  <text x="1380" y="686" font-size="13" fill="#0f5132">dashboard ↔ full-screen ads</text>
  <text x="1380" y="706" font-size="13" fill="#0f5132">countdown ring · self-sustaining revenue</text>

  <!-- branch connectors from JSON API node -->
  <path d="M1300 470 C1290 265, 1300 265, 1305 265" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <path d="M1300 470 C1295 395, 1300 395, 1305 395" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <path d="M1300 470 C1295 525, 1300 525, 1305 525" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <path d="M1300 470 C1290 665, 1300 665, 1305 665" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrowg)"/>

  <!-- Legend / flow strip -->
  <rect x="60" y="880" width="1560" height="90" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="915" font-size="15" font-weight="700" fill="#0f172a">Data flow</text>
  <text x="85" y="946" font-size="14.5" fill="#334155">Food scraped onto plate → weighed on load cell → HX711 digitises → ESP32 detects a stable event & posts to ThingSpeak → Express proxy reads all 4 channels → dashboards &amp; hostel TVs render live waste, and rotate paid ads that fund the deployment.</text>

  <!-- footer -->
  <text x="1620" y="1002" font-size="12" fill="#94a3b8" text-anchor="end">WasteWise · IIT Guwahati Technology Innovation Hub</text>
</svg>
